<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>預約需求表｜MENGRULENS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --dk:#1E4A6B;  --ac:#3D8BBF;  --lt:#CFE6F3;  --yl:#FFCB2F;  --ylt:#FFF1C2;
  --bg:#F7F8F3;  --mute:#5E7487;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--lt);color:var(--dk);font-family:'Noto Sans TC',sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;padding:18px 0 40px;
  background-image:radial-gradient(rgba(61,139,191,.18) 1.5px,transparent 1.5px);background-size:22px 22px}
a{color:inherit;text-decoration:none}

/* ── top ── */
.topbar{max-width:560px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
.topbar-brand{font-family:'Fredoka',sans-serif;font-weight:700;font-size:18px;letter-spacing:.06em}
.topbar-back{font-size:13px;font-weight:700;background:#fff;border:2px solid var(--dk);border-radius:999px;padding:4px 14px;transition:transform .15s}
.topbar-back:hover{transform:rotate(-3deg);background:var(--yl)}

/* ── hero ── */
.hero{max-width:528px;margin:16px auto 0;background:var(--dk);color:#fff;border-radius:32px;padding:26px 22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--yl);opacity:.9}
.hero>*{position:relative;z-index:1}
.hero-sub{font-family:'Fredoka',sans-serif;font-size:13px;font-weight:600;color:var(--yl);letter-spacing:.05em}
.hero-title{font-weight:900;font-size:26px;line-height:1.3}
.hero-desc{font-size:13px;opacity:.85;line-height:2;margin-top:10px}
@media(max-width:560px){.hero{margin-left:16px;margin-right:16px}}

/* ── form ── */
.form-wrap{max-width:560px;margin:0 auto;padding:0 16px}
.section-card{background:var(--bg);border-radius:32px;margin-top:16px;overflow:hidden}
.section-head{display:flex;align-items:center;gap:10px;padding:22px 20px 4px}
.section-num{font-family:'Fredoka',sans-serif;font-weight:700;font-size:14px;width:36px;height:36px;border-radius:50%;background:var(--yl);display:flex;align-items:center;justify-content:center;flex:none}
.section-name{font-weight:900;font-size:19px}
.section-body{padding:16px 20px 22px;display:flex;flex-direction:column;gap:20px}

.form-group label.field-label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.required{color:var(--ac);margin-left:3px}
.hint{font-size:12px;color:var(--mute);margin-top:5px;line-height:1.6}

input[type="text"],input[type="tel"],input[type="email"],textarea{
  width:100%;padding:12px 16px;background:#fff;border:2px solid var(--lt);color:var(--dk);
  font-family:'Noto Sans TC',sans-serif;font-size:14px;outline:none;border-radius:18px;transition:border .2s}
input::placeholder,textarea::placeholder{color:#9fb2c0}
input[type="text"]:focus,input[type="tel"]:focus,input[type="email"]:focus,textarea:focus{border-color:var(--yl)}
textarea{resize:vertical;min-height:96px;line-height:1.9}

/* ── radio / checkbox：貼紙膠囊 ── */
.options,.options.row{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px}
.option-item{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500;
  background:#fff;border:2px solid var(--lt);transition:transform .15s,border-color .15s,background .15s}
.option-item:hover{transform:translateY(-2px);border-color:var(--yl)}
.option-item:has(input:checked){background:var(--yl);border-color:var(--dk);font-weight:700}
.option-item input[type="radio"],.option-item input[type="checkbox"]{width:15px;height:15px;accent-color:var(--dk);cursor:pointer;flex-shrink:0}

/* ── submit ── */
.submit-wrap{max-width:560px;margin:20px auto 0;padding:0 16px}
.submit-btn{width:100%;padding:16px;background:var(--yl);color:var(--dk);font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:17px;letter-spacing:.1em;
  border:3px solid var(--dk);border-radius:999px;cursor:pointer;transition:transform .15s;box-shadow:0 5px 0 var(--dk)}
.submit-btn:hover{transform:translateY(-2px)}
.submit-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--dk)}

.footer{margin-top:24px;font-size:12px;color:var(--mute);text-align:center}

/* thank you */
#thank-you{display:none;max-width:528px;margin:16px auto 0;background:var(--yl);border-radius:32px;text-align:center;padding:48px 24px}
#thank-you .ty-icon{font-size:40px;margin-bottom:12px}
#thank-you .ty-title{font-weight:900;font-size:24px;margin-bottom:12px}
#thank-you .ty-msg{font-size:14px;line-height:2.2;margin-bottom:24px}
#thank-you .back-link{display:inline-block;font-size:14px;font-weight:700;background:var(--dk);color:#fff;border-radius:999px;padding:10px 20px}
</style>
</head>
<body>

<!-- top bar -->
<div class="topbar">
  <a class="topbar-brand" href="index.html">MENGRULENS</a>
  <a class="topbar-back" href="index.html">← 返回</a>
</div>

<!-- hero -->
<div class="hero">
  <div class="hero-sub">Booking Request ✦</div>
  <div class="hero-title">預約需求表</div>
  <div class="hero-desc">
    嗨！很開心你想和我合作 🌿<br>
    填完之後我會在 1–2 個工作天內與你聯繫，<br>
    我們再一起討論拍攝的細節。
  </div>
</div>

<!-- form -->
<form id="booking-form"
      action="https://formsubmit.co/claire23232624@gmail.com"
      method="POST">

  <input type="hidden" name="_subject" value="✨ 新的預約需求｜MENGRULENS">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_next" value="">

  <div class="form-wrap">

    <!-- 01 認識你 -->
    <div class="section-card">
      <div class="section-head">
        <span class="section-num">01</span>
        <span class="section-name">認識你</span>
      </div>
      <div class="section-body">

        <div class="form-group">
          <label class="field-label">姓名<span class="required">*</span></label>
          <input type="text" name="姓名" required placeholder="你的名字">
        </div>

        <div class="form-group">
          <label class="field-label">LINE ID<span class="required">*</span></label>
          <input type="text" name="LINE ID" required placeholder="填寫後我會主動與你聯繫">
        </div>

        <div class="form-group">
          <label class="field-label">Instagram 帳號</label>
          <input type="text" name="Instagram 帳號" placeholder="選填，例如 @yourname">
        </div>

        <div class="form-group">
          <label class="field-label">Email</label>
          <input type="email" name="Email" placeholder="選填">
        </div>

        <div class="form-group">
          <label class="field-label">你是從哪裡認識小孟的？<span class="required">*</span></label>
          <div class="options">
            <label class="option-item"><input type="radio" name="來源" value="Instagram" required> Instagram</label>
            <label class="option-item"><input type="radio" name="來源" value="Threads"> Threads</label>
            <label class="option-item"><input type="radio" name="來源" value="Facebook"> Facebook</label>
            <label class="option-item"><input type="radio" name="來源" value="朋友介紹"> 朋友介紹</label>
            <label class="option-item"><input type="radio" name="來源" value="其他"> 其他</label>
          </div>
        </div>

      </div>
    </div>

    <!-- 02 拍攝需求 -->
    <div class="section-card">
      <div class="section-head">
        <span class="section-num">02</span>
        <span class="section-name">拍攝需求</span>
      </div>
      <div class="section-body">

        <div class="form-group">
          <label class="field-label">拍攝類型<span class="required">*</span></label>
          <div class="options">
            <label class="option-item"><input type="radio" name="拍攝類型" value="人像寫真" required> 人像寫真</label>
            <label class="option-item"><input type="radio" name="拍攝類型" value="婚禮平面攝影"> 婚禮平面攝影</label>
            <label class="option-item"><input type="radio" name="拍攝類型" value="活動紀錄"> 活動紀錄</label>
            <label class="option-item"><input type="radio" name="拍攝類型" value="空間攝影"> 空間攝影</label>
            <label class="option-item"><input type="radio" name="拍攝類型" value="運動攝影"> 運動攝影</label>
            <label class="option-item"><input type="radio" name="拍攝類型" value="其他"> 其他</label>
          </div>
        </div>

        <div class="form-group">
          <label class="field-label">預計拍攝日期<span class="required">*</span></label>
          <input type="text" name="預計日期" required placeholder="例如：2026/08/10 或 8 月中旬">
          <div class="hint">若尚未決定，可填寫大概的時間區間</div>
        </div>

        <div class="form-group">
          <label class="field-label">拍攝地點或城市</label>
          <input type="text" name="拍攝地點" placeholder="選填，沒有想法也沒關係">
        </div>

      </div>
    </div>

    <!-- 03 拍攝細節 -->
    <div class="section-card">
      <div class="section-head">
        <span class="section-num">03</span>
        <span class="section-name">拍攝細節</span>
      </div>
      <div class="section-body">

        <div class="form-group">
          <label class="field-label">拍攝人數</label>
          <div class="options">
            <label class="option-item"><input type="radio" name="拍攝人數" value="個人"> 個人</label>
            <label class="option-item"><input type="radio" name="拍攝人數" value="雙人（情侶 / 閨蜜 / 親子）"> 雙人（情侶 / 閨蜜 / 親子）</label>
            <label class="option-item"><input type="radio" name="拍攝人數" value="3 人以上"> 3 人以上</label>
          </div>
        </div>

        <div class="form-group">
          <label class="field-label">服裝套數</label>
          <div class="options row">
            <label class="option-item"><input type="radio" name="服裝套數" value="1 套"> 1 套</label>
            <label class="option-item"><input type="radio" name="服裝套數" value="2 套"> 2 套</label>
            <label class="option-item"><input type="radio" name="服裝套數" value="3 套以上"> 3 套以上</label>
          </div>
        </div>

        <div class="form-group">
          <label class="field-label">偏好場景（可複選）</label>
          <div class="options">
            <label class="option-item"><input type="checkbox" name="拍攝場景" value="戶外自然（公園、山林、海邊）"> 戶外自然（公園、山林、海邊）</label>
            <label class="option-item"><input type="checkbox" name="拍攝場景" value="室內空間（咖啡廳、工作室）"> 室內空間（咖啡廳、工作室）</label>
            <label class="option-item"><input type="checkbox" name="拍攝場景" value="街景城市"> 街景城市</label>
            <label class="option-item"><input type="checkbox" name="拍攝場景" value="都可以，交給攝影師決定"> 都可以，交給攝影師決定</label>
          </div>
        </div>

        <div class="form-group">
          <label class="field-label">喜歡的照片風格或氛圍<span class="required">*</span></label>
          <textarea name="風格描述" required placeholder="例如：自然清新、日系柔和、暗調沉穩……任何形容詞都可以"></textarea>
        </div>

        <div class="form-group">
          <label class="field-label">參考圖或 Pinterest 連結</label>
          <input type="text" name="參考連結" placeholder="選填，貼上連結或說明">
        </div>

      </div>
    </div>

    <!-- 04 預算 -->
    <div class="section-card">
      <div class="section-head">
        <span class="section-num">04</span>
        <span class="section-name">預算範圍</span>
      </div>
      <div class="section-body">

        <div class="form-group">
          <label class="field-label">你的預算大約是？<span class="required">*</span></label>
          <div class="options">
            <label class="option-item"><input type="radio" name="預算範圍" value="NT$ 5,000 以下" required> NT$ 5,000 以下</label>
            <label class="option-item"><input type="radio" name="預算範圍" value="NT$ 5,000–10,000"> NT$ 5,000–10,000</label>
            <label class="option-item"><input type="radio" name="預算範圍" value="NT$ 10,000–20,000"> NT$ 10,000–20,000</label>
            <label class="option-item"><input type="radio" name="預算範圍" value="NT$ 20,000 以上"> NT$ 20,000 以上</label>
            <label class="option-item"><input type="radio" name="預算範圍" value="還不確定，想先了解方案"> 還不確定，想先了解方案</label>
          </div>
        </div>

      </div>
    </div>

    <!-- 05 其他 -->
    <div class="section-card">
      <div class="section-head">
        <span class="section-num">05</span>
        <span class="section-name">其他備註</span>
      </div>
      <div class="section-body">

        <div class="form-group">
          <label class="field-label">有其他想說的或特別需求嗎？</label>
          <textarea name="其他備註" placeholder="選填，任何想讓我知道的都可以寫在這裡"></textarea>
        </div>

      </div>
    </div>

  </div><!-- end form-wrap -->

  <div class="submit-wrap">
    <button type="submit" class="submit-btn">送出需求表</button>
  </div>

</form>

<!-- 送出後顯示 -->
<div id="thank-you">
  <div class="ty-icon">🌿</div>
  <div class="ty-title">謝謝你的填寫</div>
  <div class="ty-msg">
    我會在 1–2 個工作天內與你聯繫，<br>
    期待有機會和你合作，<br>
    一起留下這份美好的記錄。
  </div>
  <a class="back-link" href="index.html">← 返回首頁</a>
</div>

<div class="footer">
  林孟儒｜MENGRULENS｜@mengrulens
</div>

</body>
</html>
