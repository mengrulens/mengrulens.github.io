<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MENGRULENS｜林孟儒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a1a;font-family:"Noto Serif TC",serif;color:#fff;min-height:100vh;}

/* ══════════════════════════
   BANNER 自動播放
══════════════════════════ */
.banner{
  position:relative;width:100%;height:240px;overflow:hidden;
  border-radius:16px 16px 0 0;
}
.banner-slide{
  position:absolute;inset:0;
  background-size:cover;background-position:center top;
  opacity:0;transition:opacity 1.2s ease-in-out;
}
.banner-slide.active{opacity:1;}

/* ══════════════════════════
   PROFILE BAR
══════════════════════════ */
.profile-bar{
  background:#111;
  padding:0 20px 20px;
  position:relative;
  min-height:90px;
}
.avatar{
  position:absolute;
  top:-48px;left:20px;
  width:96px;height:96px;
  border-radius:50%;
  border:4px solid #111;
  object-fit:cover;object-position:50% 22%;
  z-index:10;
}
.profile-info{
  padding-left:124px;
  padding-top:12px;
}
.profile-name{
  font-family:"Cormorant Garamond",serif;
  font-size:24px;font-weight:400;letter-spacing:4px;
  color:#fff;margin-bottom:4px;
}
.profile-sub{font-size:13px;letter-spacing:3px;color:#a0845c;margin-bottom:14px;}

/* social icons in profile bar */
.sicons{display:flex;gap:10px;flex-wrap:wrap;}
.si{
  width:38px;height:38px;border-radius:10px;
  background:#222;
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;transition:background .2s,transform .15s;
  flex-shrink:0;
}
.si:hover{background:#333;transform:translateY(-2px);}
.si svg{width:18px;height:18px;}

/* ══════════════════════════
   MAIN CONTENT
══════════════════════════ */
.main{
  max-width:480px;margin:0 auto;
  padding:24px 16px 80px;
  display:flex;flex-direction:column;gap:12px;
}
.sec{
  font-family:"Cormorant Garamond",serif;
  font-size:12px;letter-spacing:5px;color:#555;
  text-align:center;margin:12px 0 2px;
}

/* ── portfolio photo grid ── */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:12px;overflow:hidden;}
.pgrid a{display:block;overflow:hidden;position:relative;}
.pgrid img{width:100%;display:block;transition:transform .4s;}
.pgrid a:hover img{transform:scale(1.05);}
.pgrid a:nth-child(1){grid-column:span 2;height:220px;}
.pgrid a:nth-child(1) img{height:100%;object-fit:cover;object-position:center;}
.pgrid a:nth-child(2),.pgrid a:nth-child(3){height:auto;}
.pgrid-label{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,.6));
  color:#fff;font-size:13px;letter-spacing:2px;padding:24px 12px 10px;
}
.see-more{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px;background:#222;font-size:13px;letter-spacing:4px;color:#888;
  text-decoration:none;border:1px solid #2a2a2a;transition:all .2s;border-radius:8px;
}
.see-more:hover{background:#2a2a2a;color:#a0845c;}

/* ── buttons ── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:16px 20px;
  font-family:"Noto Serif TC",serif;font-size:15px;letter-spacing:2px;
  color:#ccc;background:#1e1e1e;border:1px solid #2e2e2e;
  text-decoration:none;transition:all .2s;cursor:pointer;border-radius:8px;
}
.btn:hover{background:#252525;border-color:#a0845c;color:#fff;}
.btn.gold{
  background:linear-gradient(135deg,#a0845c,#c9a87a);
  color:#fff;border:none;letter-spacing:3px;font-size:16px;padding:18px;
  border-radius:8px;box-shadow:0 4px 20px rgba(160,132,92,.3);
}
.btn.gold:hover{background:linear-gradient(135deg,#8a6e4a,#a0845c);transform:translateY(-1px);}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn-grid .btn{font-size:14px;letter-spacing:1px;}

/* ── accordion ── */
.card{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:12px;overflow:hidden;}
.card-hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:17px 18px;cursor:pointer;user-select:none;transition:background .2s;
}
.card-hd:hover{background:#252525;}
.card-hd-label{font-size:15px;letter-spacing:2px;color:#ddd;display:flex;align-items:center;gap:10px;}
.card-arrow{font-size:11px;color:#a0845c;transition:transform .3s;}
.card.open .card-arrow{transform:rotate(180deg);}
.card-body{max-height:0;overflow:hidden;transition:max-height .45s ease;}
.card.open .card-body{max-height:1600px;}
.card-inner{padding:20px;border-top:1px solid #2a2a2a;}

/* about photos */
.about-photos{
  display:grid;grid-template-columns:1fr 1fr;gap:3px;
  border-radius:10px;overflow:hidden;margin-bottom:20px;
}
.about-photos img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:block;}
.about-intro{font-size:14px;color:#888;line-height:2.3;text-align:center;margin-bottom:20px;}
.ab-sec{font-size:12px;letter-spacing:3px;color:#555;margin:16px 0 8px;}
.ab-sec:first-of-type{margin-top:0;}

/* footer */
.footer{margin-top:40px;font-size:13px;color:#444;letter-spacing:2px;text-align:center;line-height:2.6;}
</style>
</head>

<script>
// 自動播放 banner
const slides = document.querySelectorAll('.banner-slide');
let cur = 0;
setInterval(() => {
  slides[cur].classList.remove('active');
  cur = (cur + 1) % slides.length;
  slides[cur].classList.add('active');
}, 3500);

function toggle(id){document.getElementById(id).classList.toggle('open');}
</script>
